allowBuilds:
  msedge-tts: true
  node-llama-cpp@file:_dl/node-llama-cpp-3.22.1.tgz: set this to true or false
onlyBuiltDependencies:
  - better-sqlite3
  - node-llama-cpp
  - esbuild
  - sharp
  - msedge-tts
  - chromadb
# onnxruntime-node's postinstall downloads its binaries from api.nuget.org /
# its own CDN, which is unreachable on this network (registry.npmjs.org works
# via proxy; these direct-connect endpoints ETIMEDOUT). Skip the build script:
# the package still ships types so typecheck passes, and runtime embedding
# features (chromadb optional path) degrade gracefully until the CDN is
# reachable.
ignoredBuiltDependencies:
  - onnxruntime-node
# CUDA/Vulkan llama.cpp variants are unnecessary on this host and their
# tarballs are large enough to time out on a degraded connection.
ignoredOptionalDependencies:
  - "@node-llama-cpp/win-x64-cuda"
  - "@node-llama-cpp/win-x64-cuda-ext"
  - "@node-llama-cpp/win-x64-vulkan"
