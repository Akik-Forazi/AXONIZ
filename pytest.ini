[pytest]
testpaths = axoniz/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=axoniz
    --cov-report=term-missing
    --cov-report=html
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require services running)
    benchmark: Performance benchmarks (slow)
norecursedirs = axoniz/integrations/Axodex/eval build
