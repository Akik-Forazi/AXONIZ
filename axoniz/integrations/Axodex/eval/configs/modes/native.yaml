# Native mode — Axodex tools only, no grep enrichment
#
# Explicit tools: axodex-query, axodex-context, axodex-impact, axodex-cypher
# Available as fast bash commands (~100ms via eval-server)
#
# Use this mode to isolate the value of explicit tools without grep augmentation.
agent:
  agent_class: 'eval.agents.axodex_agent.AxodexAgent'
  axodex_mode: 'native'
  step_limit: 30
  cost_limit: 3.0
  track_axodex_usage: true

environment:
  environment_class: 'eval.environments.axodex_docker.AxodexDockerEnvironment'
  enable_axodex: true
  skip_embeddings: true
  axodex_timeout: 120
  eval_server_port: 4848
