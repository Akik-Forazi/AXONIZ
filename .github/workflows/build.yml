name: Build & Test

# Verifies the unified root build pipeline (CLI tsc + Next.js web) and the
# Node test runner on both Linux and Windows. Failures in either the CLI
# build or the web build MUST exit non-zero so the root `npm run build`
# surfaces them — that contract is enforced by `&&` in the root
# package.json scripts and verified here.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        # Node 20.x is excluded because web-next/src/lib/axoniz/execution-manager.ts
        # imports `node:sqlite`, which is only available in Node 22.5+.
        # The package.json `engines.node` field reflects this (`>=22`).
        os: [ubuntu-latest, windows-latest]
        node-version: [22.x, 24.x]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'pwsh' || 'bash' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # We need full history for parity documentation commits, but
          # shallow clone is fine for build verification.
          fetch-depth: 1

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web-next/package-lock.json

      # The root package declares @fraziym/axodex as a mandatory
      # peerDependency. We also list it in devDependencies so it
      # materializes in the lockfile — plain `npm ci --ignore-scripts`
      # works (no --legacy-peer-deps needed). --ignore-scripts skips the
      # tree-sitter-graphql native build which fails on Node 24.
      - name: Install root deps
        run: npm ci --ignore-scripts

      - name: Install web-next deps
        run: |
          cd web-next
          npm ci --ignore-scripts

      # Native rebuilds (sharp, systeminformation) need to run AFTER
      # install because --ignore-scripts skipped them. tree-sitter-graphql
      # is allowed to fail (Node 24 API mismatch — non-blocking).
      - name: Rebuild native modules
        run: npm rebuild --ignore-scripts 2>&1 || true

      - name: Typecheck CLI
        run: npm run typecheck

      - name: Typecheck Web
        run: npm run typecheck:web
        # 0 errors as of commit 883e88b — kept continue-on-error as a
        # safety net in case new errors creep in. Remove once stable.
        continue-on-error: true

      - name: Build CLI
        run: npm run build:cli

      - name: Build Web
        run: npm run build:web
        env:
          # Next.js may try to reach the network for telemetry; disable it.
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Build (unified root)
        run: npm run build

      # Tests import from dist/, so they MUST run after build:cli.
      - name: Test (Node test runner)
        run: npm test
