name: Build & Test

# Verifies the unified root build pipeline (CLI tsc + Next.js web) and the
# Node test runner on both Linux and Windows. Failures in either the CLI
# build or the web build MUST exit non-zero so the root `npm run build`
# surfaces them — that contract is enforced by `&&` in the root
# package.json scripts and verified here.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20.x, 22.x, 24.x]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'pwsh' || 'bash' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # We need full history for parity documentation commits, but
          # shallow clone is fine for build verification.
          fetch-depth: 1

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web-next/package-lock.json

      # The root package declares mandatory peerDependencies
      # (@fraziym/axodex etc.) that are not in the lockfile because the
      # lockfile was generated with --legacy-peer-deps. We use the same
      # flag here so `npm ci` is reproducible across environments.
      - name: Install root deps (Linux)
        if: matrix.os != 'windows-latest'
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Install root deps (Windows)
        if: matrix.os == 'windows-latest'
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Install web-next deps
        run: |
          cd web-next
          npm ci --ignore-scripts

      # Native rebuilds (sharp, systeminformation, optional sharp) need
      # to run AFTER install because --ignore-scripts skipped them.
      - name: Rebuild native modules
        run: npm rebuild --ignore-scripts 2>&1 || true

      - name: Typecheck CLI
        run: npm run typecheck

      - name: Typecheck Web
        run: npm run typecheck:web
        continue-on-error: true
        # Web typecheck has pre-existing errors documented in
        # docs/CLI_WEB_PARITY.md — do not block CI on them, but report.

      - name: Build CLI
        run: npm run build:cli

      - name: Build Web
        run: npm run build:web
        env:
          # Next.js may try to reach the network for telemetry; disable it.
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Build (unified root)
        run: npm run build

      # Tests import from dist/, so they MUST run after build:cli.
      - name: Test (Node test runner)
        run: npm test
