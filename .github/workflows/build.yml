name: Build & Test

# Verifies the unified root build pipeline (CLI tsc + Next.js web) and the
# Node test runner on both Linux and Windows. Failures in either the CLI
# build or the web build MUST exit non-zero so the root `npm run build`
# surfaces them — that contract is enforced by `&&` in the root
# package.json scripts and verified here.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        # Node 20.x is excluded because web-next/src/lib/axoniz/execution-manager.ts
        # imports `node:sqlite`, which is only available in Node 22.5+.
        # The package.json `engines.node` field reflects this (`>=22`).
        os: [ubuntu-latest, windows-latest]
        node-version: [22.x, 24.x]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'pwsh' || 'bash' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # We need full history for parity documentation commits, but
          # shallow clone is fine for build verification.
          fetch-depth: 1

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web-next/package-lock.json

      # Plain `npm ci` runs install scripts for all packages — sharp,
      # node-llama-cpp, systeminformation, tree-sitter-* grammars all
      # need their install scripts to either download prebuilds or run
      # node-gyp-build (which prefers prebuilds over source compilation).
      # The tree-sitter-* grammar packages ship prebuilds for linux-x64
      # AND win32-x64, so no source compilation happens on CI runners.
      #
      # The ONE package that would fail native compile on Node 22+
      # (tree-sitter-graphql — uses Node 12 V8 C++ API in its binding.cc)
      # is stubbed out via npm `overrides` in package.json, pointing at
      # scripts/tree-sitter-graphql-stub/. The stub has no binding.gyp,
      # so npm's auto-rebuild doesn't trigger for it.
      - name: Install root deps
        run: npm ci

      - name: Install web-next deps
        run: |
          cd web-next
          npm ci

      - name: Typecheck CLI
        run: npm run typecheck

      - name: Typecheck Web
        run: npm run typecheck:web
        # 0 errors as of commit 883e88b — kept continue-on-error as a
        # safety net in case new errors creep in. Remove once stable.
        continue-on-error: true

      - name: Build CLI
        run: npm run build:cli

      - name: Build Web
        run: npm run build:web
        env:
          # Next.js may try to reach the network for telemetry; disable it.
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Build (unified root)
        run: npm run build

      # Tests import from dist/, so they MUST run after build:cli.
      - name: Test (Node test runner)
        run: npm test
